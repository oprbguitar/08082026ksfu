name: Actualizar normas (El Peruano)

# Refresca automaticamente el bloque `normas` de data.js desde El Peruano y
# redespliega. Corre en la nube de GitHub, donde El Peruano SI es alcanzable.
# Para el visitante es invisible: solo ve datos siempre frescos + los contadores
# y noticias que ya se actualizan en vivo por visita.

on:
  schedule:
    # Cada 6 horas: 01:17, 07:17, 13:17 y 19:17 hora de Lima (UTC-5). Minuto
    # 17 y no 00 para esquivar la congestion de GitHub a la hora en punto.
    # Revisa los ultimos 14 dias y suma lo nuevo sin borrar nada.
    - cron: "17 0,6,12,18 * * *"
    # Domingo 03:41 Lima: barrido completo desde la asuncion, por si algun
    # dia El Peruano respondio parcial y quedo una norma sin recoger.
    - cron: "41 8 * * 0"
  workflow_dispatch:
    inputs:
      completo:
        description: "Barrido completo desde la asuncion (28/07/2026)"
        type: boolean
        default: false

# Evita corridas solapadas si una tarda mas de lo previsto.
concurrency:
  group: actualizar-normas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrapear y actualizar data.js
        run: |
          if [ "${{ github.event.schedule }}" = "41 8 * * 0" ] || [ "${{ inputs.completo }}" = "true" ]; then
            node scripts/actualizar.mjs --completo
          else
            node scripts/actualizar.mjs
          fi

      - name: Commit y push si hubo cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "govisor-bot"
            git config user.email "govisor-bot@users.noreply.github.com"
            git add -A
            git commit -m "Actualizacion automatica de normas desde El Peruano"
            # Si entretanto llego otro commit a main, se rebasa y se reintenta.
            git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; }
            echo "Cambios publicados."
          else
            echo "Sin cambios: nada que publicar."
          fi
