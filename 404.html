<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<script>
/* Dominio canonico: gobierno.quest -------------------------------------
   Con el archivo CNAME, la publicacion ya responde 301 desde la URL de
   publicacion hacia el dominio propio. Este guardia hace lo mismo desde
   el navegador y se ejecuta antes de que se
   pinte o se descargue nada, de modo que la URL github.io no llega a
   verse aunque Pages todavia no haya aplicado el CNAME o el navegador
   sirva la pagina desde su cache.
   No toca localhost ni ningun otro host: solo *.github.io.
   --------------------------------------------------------------------- */
(function () {
  var DOMINIO = "gobierno.quest";
  var host = location.hostname;
  if (host === DOMINIO || host === "www." + DOMINIO) return;
  if (!/\.github\.io$/i.test(host)) return;
  var ruta = location.pathname.replace(/^\/[^/]+(\/|$)/, "/");
  location.replace("https://" + DOMINIO + ruta + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=https://gobierno.quest/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GoVisor</title>
<link rel="canonical" href="https://gobierno.quest/">
<style>
  body{ margin:0; min-height:100vh; display:grid; place-items:center;
        background:#005C59; color:#fff; text-align:center; padding:24px;
        font:400 1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a{ color:#fff; }
</style>
</head>
<body>
  <p>Esta página vive ahora en <a href="https://gobierno.quest/">gobierno.quest</a>.</p>
</body>
</html>
